<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ご予約|シアワセニナリタイカフェ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #FF5278;
      --pink-light: #FFEDF1;
      --blue: #2B94FF;
      --blue-light: #EAF4FF;
      --gray: #D9D9D9;
      --gray-text: #828282;
      --text: #222222;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FFFFFF;
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
    button { font-family: inherit; font-size: 16px; color: inherit; }

    .steps { display: flex; justify-content: space-between; position: relative; margin: 8px 0 24px; padding: 0; list-style: none; }
    .steps::before { content: ''; position: absolute; top: 18px; left: 18%; right: 18%; height: 3px; background: var(--gray); }
    .step { position: relative; flex: 1; text-align: center; font-size: 12px; white-space: nowrap; }
    .step:nth-child(2) { flex: 1.4; }
    .step .dot {
      width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--gray); color: var(--text); font-weight: 700;
    }
    .step.now .dot { background: var(--pink); color: #FFFFFF; }
    .step.done .dot { background: #FFB8C8; color: #FFFFFF; }

    .visual { display: block; width: 100%; height: auto; margin-bottom: 16px; }

    h2 { font-size: 17px; font-weight: 400; margin: 24px 0 10px; }

    .plans { display: grid; grid-auto-rows: 1fr; gap: 12px; }
    .plan-card {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 10px;
      border: 2px solid var(--gray); border-radius: 12px; background: #FFFFFF; cursor: pointer;
    }
    .plan-card img { width: 96px; height: 80px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .plan-card .plan-text { flex: 1; min-width: 0; display: block; }
    .plan-card .plan-name { display: block; font-size: 16px; white-space: nowrap; }
    .plan-card .plan-time { display: block; text-align: right; font-size: 13px; line-height: 1.4; }
    .plan-card .plan-desc { display: block; font-size: 12px; margin-top: 4px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    .plan-card input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--pink); }
    .plan-card.cafe.selected { border-color: var(--pink); background: var(--pink-light); }
    .plan-card.soudan.selected { border-color: var(--blue); background: var(--blue-light); }
    .plan-card.soudan input { accent-color: var(--blue); }

    .people { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice {
      min-height: 48px; border: 2px solid var(--gray); border-radius: 999px; background: #FFFFFF;
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    .choice i { color: var(--pink); }
    .choice.selected { border-color: var(--pink); background: var(--pink-light); color: var(--pink); font-weight: 700; }
    .choice.disabled { background: var(--gray); border-color: var(--gray); color: var(--gray-text); }
    .choice.disabled i { color: var(--gray-text); }
    .note { font-size: 13px; color: var(--gray-text); margin: 8px 0 0; }

    .picker {
      width: 100%; min-height: 48px; padding: 8px 16px;
      border: 2px solid var(--gray); border-radius: 12px; background: #FFFFFF;
      display: flex; align-items: center; gap: 16px; text-align: left; cursor: pointer;
    }
    .picker i.lead { color: var(--pink); font-size: 20px; }
    .picker .value { flex: 1; }
    .picker .value.empty { color: var(--gray-text); }
    .picker .fa-chevron-down { transition: transform 0.2s; }
    .picker[aria-expanded="true"] .fa-chevron-down { transform: rotate(180deg); }

    .panel { border: 2px solid var(--gray); border-top: none; border-radius: 0 0 12px 12px; padding: 12px; margin-top: -8px; padding-top: 18px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-head button { width: 44px; height: 44px; border: none; background: none; cursor: pointer; }
    .cal-head button:disabled { color: var(--gray); cursor: default; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-grid .wd { font-size: 12px; color: var(--gray-text); }
    .cal-grid button {
      height: 40px; border: none; border-radius: 8px; background: var(--pink-light); cursor: pointer;
    }
    .cal-grid button:disabled { background: none; color: var(--gray); cursor: default; }
    .cal-grid button.selected { background: var(--pink); color: #FFFFFF; font-weight: 700; }

    .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .times button {
      height: 44px; border: 2px solid var(--gray); border-radius: 8px; background: #FFFFFF; cursor: pointer;
    }
    .times button.selected { border-color: var(--pink); background: var(--pink); color: #FFFFFF; font-weight: 700; }
    .panel-message { margin: 0; color: var(--gray-text); font-size: 14px; }

    .main-button {
      width: 100%; min-height: 52px; margin-top: 32px; border: none; border-radius: 999px;
      background: var(--pink); color: #FFFFFF; font-weight: 700; position: relative; cursor: pointer;
    }
    .main-button i { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); }
    .main-button:disabled { background: var(--gray); color: var(--gray-text); cursor: default; }
    .sub-button {
      width: 100%; min-height: 52px; margin-top: 16px; border: 2px solid var(--pink); border-radius: 999px;
      background: #FFFFFF; color: var(--pink); font-weight: 700; cursor: pointer;
    }

    .temp label { display: block; margin-top: 12px; }
    .temp input, .temp select { width: 100%; font-size: 16px; padding: 8px; margin-top: 4px; }
    #result { margin-top: 16px; font-weight: 700; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
<main>
  <section id="g1">
    <ol class="steps" aria-label="予約の手順">
      <li class="step now"><div class="dot">1</div>予約内容の選択</li>
      <li class="step"><div class="dot">2</div>お客様情報の入力・確認</li>
      <li class="step"><div class="dot">3</div>予約完了</li>
    </ol>

    <img class="visual" src="images/main.webp" width="900" height="604"
         alt="はじめまして。シアワセニナリタイカフェです。あなたの思い描く幸せへの第一歩を、カフェから。">

    <h2>プランを選ぶ</h2>
    <div class="plans">
    <label class="plan-card cafe" id="planCardA">
      <input type="radio" name="plan" value="A" checked>
      <img src="images/thumb-cafe.webp" width="288" height="240" alt="">
      <span class="plan-text">
        <span class="plan-name">カフェ+初回相談</span>
        <span class="plan-time">135分<br>(60分+75分)</span>
        <span class="plan-desc">カフェで<wbr>くつろぎながら<wbr>理想の<wbr>結婚相手を<wbr>探して<wbr>みましょう</span>
      </span>
    </label>
    <label class="plan-card soudan" id="planCardB">
      <input type="radio" name="plan" value="B">
      <img src="images/thumb-soudan.webp" width="288" height="240" alt="">
      <span class="plan-text">
        <span class="plan-name">ご相談</span>
        <span class="plan-time">90分</span>
        <span class="plan-desc">落ち着いた<wbr>空間で<wbr>結婚や<wbr>出会いについて<wbr>じっくり<wbr>お話します</span>
      </span>
    </label>
    </div>

    <h2>人数を選ぶ</h2>
    <div class="people">
      <label class="choice" id="people1">
        <input class="visually-hidden" type="radio" name="people" value="1" checked>
        <i class="fa-solid fa-user" aria-hidden="true"></i>1名
      </label>
      <label class="choice" id="people2">
        <input class="visually-hidden" type="radio" name="people" value="2">
        <i class="fa-solid fa-user-group" aria-hidden="true"></i>2名
      </label>
    </div>
    <p class="note" id="peopleNote" hidden>2名でのご予約はカフェ+初回相談のみです</p>

    <h2>日にちを選ぶ</h2>
    <button type="button" class="picker" id="datePicker" aria-expanded="false" aria-controls="calendarPanel">
      <i class="fa-regular fa-calendar-days lead" aria-hidden="true"></i>
      <span class="value empty" id="dateValue">日にちを選んでください</span>
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
    <div class="panel" id="calendarPanel" hidden>
      <div class="cal-head">
        <button type="button" id="prevMonth" aria-label="前の月"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="monthLabel"></span>
        <button type="button" id="nextMonth" aria-label="次の月"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="calendarGrid"></div>
      <p class="panel-message" id="calendarMessage"></p>
    </div>

    <h2>開始時間を選ぶ</h2>
    <button type="button" class="picker" id="timePicker" aria-expanded="false" aria-controls="timePanel">
      <i class="fa-regular fa-clock lead" aria-hidden="true"></i>
      <span class="value empty" id="timeValue">時間を選んでください</span>
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
    <div class="panel" id="timePanel" hidden>
      <div class="times" id="timeList"></div>
      <p class="panel-message" id="timeMessage"></p>
    </div>

    <button type="button" class="main-button" id="nextButton" disabled>
      次へ<i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    </button>
  </section>

  <section id="g2" class="temp" hidden>
    <h2>お客様情報の入力(仮の画面。次に作り直す)</h2>
    <p id="summary"></p>

    <label for="name">お名前</label>
    <input type="text" id="name" placeholder="例)山田 花子">

    <label for="phone">電話番号</label>
    <input type="tel" id="phone" placeholder="例)090-0000-0000">

    <label for="gender">性別</label>
    <select id="gender">
      <option value="">選んでください</option>
      <option value="女性">女性</option>
      <option value="男性">男性</option>
    </select>

    <label for="age">年齢</label>
    <input type="number" id="age" min="1" max="120">

    <button type="button" class="main-button" id="reserve">この内容で予約する</button>
    <button type="button" class="sub-button" id="backButton">戻る</button>
    <p id="result"></p>
  </section>
</main>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '2012030177-wT0vjxjH';
  const GAS_URL = 'ここに今のGoogle Apps ScriptのURLを貼る';
  const BOOKING_MONTHS = 3;
  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  const state = { plan: 'A', people: '1', date: '', time: '' };
  const calendar = { year: 0, month: 0 };
  const monthCache = {};
  const timesCache = {};
  let lineUserId = '';
  let lineName = '';
  let timesRequest = 0;

  /**
   * ページを開いたときに、LINEの機能を準備して、LINEのユーザーIDと名前を取る
   * LINEの外(パソコンのブラウザなど)で開いたときは、LINEの情報なしで使える
   */
  async function initLine() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isInClient() && !liff.isLoggedIn()) return;
      const profile = await liff.getProfile();
      lineUserId = profile.userId;
      lineName = profile.displayName;
    } catch (error) {
      console.log('LINEの情報を取れませんでした:' + error.message);
    }
  }

  /**
   * Google Apps Scriptに問い合わせて、答え(JSON)を返す
   * 答えが ok: false のときや、通信に失敗したときはエラーにする
   */
  async function askGas(query) {
    const response = await fetch(GAS_URL + '?' + new URLSearchParams(query));
    const data = await response.json();
    if (!data.ok) throw new Error(data.error);
    return data;
  }

  /**
   * "2026-11-02" を「2026年11月2日(月)」の形にする
   */
  function formatDate(dayText) {
    const [y, m, d] = dayText.split('-').map(Number);
    const weekday = WEEKDAYS[new Date(y, m - 1, d).getDay()];
    return y + '年' + m + '月' + d + '日(' + weekday + ')';
  }

  /**
   * 年と月を "2026-11" の形にする
   */
  function monthKey(year, month) {
    return year + '-' + String(month).padStart(2, '0');
  }

  /**
   * プランを選んだときの見た目と、人数の選び方を変える
   * ご相談(プランB)では2名を選べないようにし、2名を選んでいたら1名に戻す
   */
  function updatePlan() {
    document.getElementById('planCardA').classList.toggle('selected', state.plan === 'A');
    document.getElementById('planCardB').classList.toggle('selected', state.plan === 'B');

    const twoAllowed = state.plan === 'A';
    const twoInput = document.querySelector('input[name="people"][value="2"]');
    twoInput.disabled = !twoAllowed;
    document.getElementById('people2').classList.toggle('disabled', !twoAllowed);
    if (!twoAllowed && state.people === '2') {
      state.people = '1';
      document.querySelector('input[name="people"][value="1"]').checked = true;
    }
    if (twoAllowed) document.getElementById('peopleNote').hidden = true;
    updatePeople();
  }

  /**
   * 人数を選んだときの見た目を変える
   */
  function updatePeople() {
    document.getElementById('people1').classList.toggle('selected', state.people === '1');
    document.getElementById('people2').classList.toggle('selected', state.people === '2');
  }

  /**
   * パネル(カレンダーか時刻の一覧)を開く・閉じる
   */
  function setPanel(pickerId, panelId, open) {
    document.getElementById(pickerId).setAttribute('aria-expanded', String(open));
    document.getElementById(panelId).hidden = !open;
  }

  /**
   * カレンダーを開く・閉じる。開くときは、選んでいる日の月(なければ今月)を表示する
   */
  function toggleCalendar() {
    const open = document.getElementById('calendarPanel').hidden;
    setPanel('datePicker', 'calendarPanel', open);
    if (!open) return;
    const base = state.date !== '' ? state.date : todayText();
    const [y, m] = base.split('-').map(Number);
    showMonth(y, m);
  }

  /**
   * 今日の日付を "2026-10-30" の形で返す
   */
  function todayText() {
    const now = new Date();
    return monthKey(now.getFullYear(), now.getMonth() + 1) + '-' + String(now.getDate()).padStart(2, '0');
  }

  /**
   * カレンダーに1か月分を描く。選べる日はGoogle Apps Scriptに聞く(1度聞いた月は覚えておく)
   */
  async function showMonth(year, month) {
    calendar.year = year;
    calendar.month = month;
    document.getElementById('monthLabel').textContent = year + '年' + month + '月';

    const now = new Date();
    const firstIndex = now.getFullYear() * 12 + now.getMonth();
    const index = year * 12 + (month - 1);
    document.getElementById('prevMonth').disabled = index <= firstIndex;
    document.getElementById('nextMonth').disabled = index >= firstIndex + BOOKING_MONTHS;

    const grid = document.getElementById('calendarGrid');
    const message = document.getElementById('calendarMessage');
    grid.innerHTML = '';
    message.textContent = '読み込んでいます…';

    const key = monthKey(year, month);
    let openDays;
    try {
      openDays = await getOpenDays(key);
    } catch (error) {
      message.textContent = '通信に失敗しました。しばらくしてからもう一度お試しください';
      return;
    }
    if (calendar.year !== year || calendar.month !== month) return;

    message.textContent = '';
    for (const w of WEEKDAYS) {
      const head = document.createElement('div');
      head.className = 'wd';
      head.textContent = w;
      grid.appendChild(head);
    }
    const blank = new Date(year, month - 1, 1).getDay();
    for (let i = 0; i < blank; i++) grid.appendChild(document.createElement('div'));

    const daysInMonth = new Date(year, month, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const dayText = key + '-' + String(d).padStart(2, '0');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = d;
      button.disabled = !openDays.includes(dayText);
      button.classList.toggle('selected', dayText === state.date);
      button.addEventListener('click', () => selectDate(dayText));
      grid.appendChild(button);
    }
  }

  /**
   * 1か月分の「受け付ける日ごとの予約できる時刻」を返す(action=monthTimes)
   * 例:{ '2026-11-02': { 'A-1': [...], 'A-2': [...], 'B-1': [...] }, ... }
   * 1度聞いた月は覚えておく。聞いている途中でもう一度呼ばれたら、同じ問い合わせの答えを待つ
   */
  function getMonthData(key) {
    if (!monthCache[key]) {
      monthCache[key] = askGas({ action: 'monthTimes', month: key }).then(data => data.days);
      monthCache[key].catch(() => delete monthCache[key]);
    }
    return monthCache[key];
  }

  /**
   * その月の予約を受け付ける日の一覧を返す(1か月分のデータに入っている日)
   */
  async function getOpenDays(key) {
    const days = await getMonthData(key);
    return Object.keys(days);
  }

  /**
   * ページを開いたときに、今月から予約できる期間の最後の月までの1か月分のデータを先に聞いておく
   * (カレンダーを開いたときも、日にちを選んだときも、待たずに済むようにするため)
   */
  function prefetchMonths() {
    const now = new Date();
    for (let i = 0; i <= BOOKING_MONTHS; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      getMonthData(monthKey(d.getFullYear(), d.getMonth() + 1)).catch(() => {});
    }
  }

  /**
   * その日の、プランと人数のすべての組み合わせの予約できる時刻を返す
   * 聞き直した答え(timesCache)があればそれを、なければ1か月分のデータから取り出す
   */
  async function getTimesAll(dayText) {
    if (timesCache[dayText]) return timesCache[dayText];
    const days = await getMonthData(dayText.slice(0, 7));
    return days[dayText] || {};
  }

  /**
   * その日の予約できる時刻を、Google Apps Scriptに聞き直す(action=availableAll)
   * 入力の画面から戻ったときなど、時間がたって空きが変わったかもしれないときに使う
   */
  function refreshTimes(dayText) {
    timesCache[dayText] = askGas({ action: 'availableAll', date: dayText }).then(data => data.times);
    timesCache[dayText].catch(() => delete timesCache[dayText]);
  }

  /**
   * カレンダーの月を前(-1)か次(+1)に動かす
   */
  function moveMonth(diff) {
    const moved = new Date(calendar.year, calendar.month - 1 + diff, 1);
    showMonth(moved.getFullYear(), moved.getMonth() + 1);
  }

  /**
   * 日にちを選んだときに、カレンダーを閉じ、時刻の一覧を開いて見える位置までスクロールする
   */
  function selectDate(dayText) {
    state.date = dayText;
    const value = document.getElementById('dateValue');
    value.textContent = formatDate(dayText);
    value.classList.remove('empty');
    setPanel('datePicker', 'calendarPanel', false);
    setPanel('timePicker', 'timePanel', true);
    loadTimes();
    document.getElementById('timePicker').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /**
   * 時刻の一覧を開く・閉じる
   */
  function toggleTimes() {
    const open = document.getElementById('timePanel').hidden;
    setPanel('timePicker', 'timePanel', open);
    if (open && document.getElementById('timeList').children.length === 0) loadTimes();
  }

  /**
   * プラン・人数・日にちに合う、予約できる開始時刻をGoogle Apps Scriptに聞いて並べる
   * 選んでいた時刻がなくなったら、時刻の選択を外す
   */
  async function loadTimes() {
    const list = document.getElementById('timeList');
    const message = document.getElementById('timeMessage');
    list.innerHTML = '';

    if (state.date === '') {
      message.textContent = '日にちを選ぶと、予約できる時間が表示されます';
      return;
    }

    message.textContent = '調べています…';
    const request = ++timesRequest;
    let times;
    try {
      const all = await getTimesAll(state.date);
      times = all[state.plan + '-' + state.people] || [];
    } catch (error) {
      if (request !== timesRequest) return;
      message.textContent = '通信に失敗しました。しばらくしてからもう一度お試しください';
      return;
    }
    if (request !== timesRequest) return;

    if (!times.includes(state.time)) setTime('');

    if (times.length === 0) {
      message.textContent = 'この日は予約できる時間がありません。ほかの日を選んでください';
      return;
    }
    message.textContent = '';
    for (const time of times) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = time;
      button.classList.toggle('selected', time === state.time);
      button.addEventListener('click', () => {
        setTime(time);
        for (const b of list.children) b.classList.toggle('selected', b === button);
      });
      list.appendChild(button);
    }
  }

  /**
   * 開始時刻を決める(空の文字なら選択を外す)。表示と「次へ」ボタンも変える
   */
  function setTime(time) {
    state.time = time;
    const value = document.getElementById('timeValue');
    value.textContent = time !== '' ? time : '時間を選んでください';
    value.classList.toggle('empty', time === '');
    updateNextButton();
  }

  /**
   * プラン・人数・日にち・時間がそろったときだけ「次へ」を押せるようにする
   */
  function updateNextButton() {
    document.getElementById('nextButton').disabled = !(state.plan && state.people && state.date && state.time);
  }

  /**
   * 「次へ」を押したときに、G1を隠して入力の画面(仮)を出す
   */
  function goToInput() {
    const planName = state.plan === 'A' ? 'カフェ+初回相談' : 'ご相談';
    document.getElementById('summary').textContent =
      planName + '/' + state.people + '名/' + formatDate(state.date) + ' ' + state.time + '〜';
    document.getElementById('g1').hidden = true;
    document.getElementById('g2').hidden = false;
    window.scrollTo(0, 0);
  }

  /**
   * 入力の画面(仮)から、G1に戻る(選んだ内容は残す)
   */
  function backToSelect() {
    document.getElementById('g2').hidden = true;
    document.getElementById('g1').hidden = false;
    refreshTimes(state.date);
    loadTimes();
  }

  /**
   * 「この内容で予約する」が押されたときに、予約をGoogle Apps Scriptに送る(仮の画面用)
   */
  async function reserve() {
    const result = document.getElementById('result');
    const data = {
      action: 'reserve',
      date: state.date,
      plan: state.plan,
      people: state.people,
      time: state.time,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      gender: document.getElementById('gender').value,
      age: document.getElementById('age').value,
      lineUserId: lineUserId,
      lineName: lineName
    };

    if (data.name.trim() === '' || data.phone.trim() === '' || data.gender === '' || data.age === '') {
      result.textContent = 'お名前・電話番号・性別・年齢をすべて入力してください';
      return;
    }

    const button = document.getElementById('reserve');
    button.disabled = true;
    result.textContent = '予約しています…';
    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      const answer = await response.json();
      result.textContent = answer.ok ? 'ご予約が完了しました' : '予約できませんでした:' + answer.error;
    } catch (error) {
      result.textContent = '通信に失敗しました。予約はまだ確定していません';
    } finally {
      button.disabled = false;
    }
  }

  for (const input of document.querySelectorAll('input[name="plan"]')) {
    input.addEventListener('change', () => {
      state.plan = input.value;
      updatePlan();
      if (state.date !== '') loadTimes();
    });
  }
  for (const input of document.querySelectorAll('input[name="people"]')) {
    input.addEventListener('change', () => {
      state.people = input.value;
      updatePeople();
      if (state.date !== '') loadTimes();
    });
  }
  document.getElementById('people2').addEventListener('click', () => {
    if (state.plan === 'B') document.getElementById('peopleNote').hidden = false;
  });
  document.getElementById('datePicker').addEventListener('click', toggleCalendar);
  document.getElementById('prevMonth').addEventListener('click', () => moveMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => moveMonth(1));
  document.getElementById('timePicker').addEventListener('click', toggleTimes);
  document.getElementById('nextButton').addEventListener('click', goToInput);
  document.getElementById('backButton').addEventListener('click', backToSelect);
  document.getElementById('reserve').addEventListener('click', reserve);

  updatePlan();
  prefetchMonths();
  initLine();
</script>
</body>
</html>
